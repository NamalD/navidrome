# This fork's own pipeline (upstream's are disabled here). Checks the web UI and the Go code, builds the Docker image
# into ghcr.io/namald/navidrome:<upstream version>-<short sha>, and deploys that tag to the VPS. The VPS key can only
# run the deploy script there, which pulls the tag, restarts Navidrome, and goes back to the previous tag if it doesn't
# answer.
# Pushing to `main` runs it. Run it by hand with a tag to roll back to that image without building. See FORK.md.
name: "Fork: Build and Deploy"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Deploy this existing image tag instead of building, e.g. 0.64.2-a1b2c3d
        required: false

concurrency:
  group: fork-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/namald/navidrome

jobs:
  build:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
      - name: Check the web UI
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm run check-formatting
          npm test
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test the Go code
        # The same packages and tags as upstream's pipeline; the plugins suite is left out as it is there.
        run: go test -shuffle=on -tags netgo,sqlite_fts5 $(go list ./... | grep -v '/plugins$')
      - name: Work out the version
        id: version
        run: |
          # The upstream release this commit is based on, e.g. v0.64.2
          base=$(git describe --tags --abbrev=0 --match 'v*')
          echo "git_tag=$base" >> "$GITHUB_OUTPUT"
          echo "tag=${base#v}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_TAG=${{ steps.version.outputs.git_tag }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.tag != ''))
    runs-on: ubuntu-latest
    environment:
      name: vps
      url: https://music.namal.dev
    steps:
      - name: Deploy to the VPS
        env:
          TAG: ${{ needs.build.outputs.tag || inputs.tag }}
          KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ vars.VPS_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "namal@$HOST" navidrome "$TAG"
